ntrip_client:
  ros__parameters:
    # NTRIP Server Configuration
    host: "eu.all-freq.skylark.swiftnav.com"        # Change to the IP address of Your NTRIP caster
    port: 2101                  # Change to your port number WGS84
    mountpoint: "NXRTK-MSM5"            # Your NTRIP mountpoint
    username: "${NTRIP_USERNAME}"    # Your NTRIP username (from .env, resolved at launch)
    password: "${NTRIP_PASSWORD}"     # Your NTRIP password (from .env, resolved at launch)

    # NMEA and Update Rate Configuration
    nmea_input_rate: 4.0          # Input NMEA rate in Hz (default: 4.0)
    update_rate: 1.0              # Desired rate for sending GGA messages (Hz)

    # Connection Configuration
    reconnect_delay: 5.0          # Delay between reconnection attempts (seconds)
    max_reconnect_attempts: 0     # 0 for infinite attempts

    # Debug Configuration
    send_default_gga: False        # Set to False if using real GNSS data
    debug: False                  # Set to True for detailed debug output
    output_rtcm_details: False     # Set to True for RTCM message details