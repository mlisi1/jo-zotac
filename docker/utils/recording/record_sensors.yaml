# Sensors only (for offline reprocessing / calibration): compressed images, no nav/localization.
# Topics: 75. Usage (see docker/utils/recordings.bash):
#   ros2 run rosbag2_transport recorder --ros-args \
#     --params-file /home/ros/utils/recording/record_sensors.yaml \
#     -p storage.uri:=/home/ros/bags/<timestamp>_<name>
/**:
  ros__parameters:
    record:
      topics:
        # --- LiDAR ---
        - /velodyne_packets
        - /velodyne_points
        - /scan
        # --- Xsens IMU ---
        - /imu/data
        - /imu/mag
        - /imu/acceleration
        - /imu/angular_velocity
        - /imu/time_ref
        - /imu/utctime
        - /filter/euler
        - /filter/free_acceleration
        - /filter/quaternion
        - /filter/twist
        - /filter/velocity
        - /filter/positionlla
        - /pressure
        - /temperature
        - /status
        # --- GNSS / RTK ---
        - /gnss
        - /gnss_pose
        - /nmea
        - /rtcm
        - /ntrip/diagnostics
        # --- Camera info / metadata / IMU ---
        - /front_camera/camera/color/camera_info
        - /front_camera/camera/color/metadata
        - /front_camera/camera/depth/camera_info
        - /front_camera/camera/depth/metadata
        - /front_camera/camera/infra1/camera_info
        - /front_camera/camera/infra1/metadata
        - /front_camera/camera/infra2/camera_info
        - /front_camera/camera/infra2/metadata
        - /front_camera/camera/aligned_depth_to_color/camera_info
        - /front_camera/camera/accel/sample
        - /front_camera/camera/accel/imu_info
        - /front_camera/camera/accel/metadata
        - /front_camera/camera/gyro/sample
        - /front_camera/camera/gyro/imu_info
        - /front_camera/camera/gyro/metadata
        - /front_camera/camera/extrinsics/depth_to_accel
        - /front_camera/camera/extrinsics/depth_to_color
        - /front_camera/camera/extrinsics/depth_to_gyro
        - /front_camera/camera/extrinsics/depth_to_infra1
        - /front_camera/camera/extrinsics/depth_to_infra2
        - /back_camera/camera/color/camera_info
        - /back_camera/camera/color/metadata
        - /back_camera/camera/depth/camera_info
        - /back_camera/camera/depth/metadata
        - /back_camera/camera/infra1/camera_info
        - /back_camera/camera/infra1/metadata
        - /back_camera/camera/infra2/camera_info
        - /back_camera/camera/infra2/metadata
        - /back_camera/camera/aligned_depth_to_color/camera_info
        - /back_camera/camera/accel/sample
        - /back_camera/camera/accel/imu_info
        - /back_camera/camera/accel/metadata
        - /back_camera/camera/gyro/sample
        - /back_camera/camera/gyro/imu_info
        - /back_camera/camera/gyro/metadata
        - /back_camera/camera/extrinsics/depth_to_accel
        - /back_camera/camera/extrinsics/depth_to_color
        - /back_camera/camera/extrinsics/depth_to_gyro
        - /back_camera/camera/extrinsics/depth_to_infra1
        - /back_camera/camera/extrinsics/depth_to_infra2
        # --- Camera images (color/IR: compressed, depth: compressedDepth) ---
        - /front_camera/camera/color/image_raw/compressed
        - /front_camera/camera/infra1/image_rect_raw/compressed
        - /front_camera/camera/infra2/image_rect_raw/compressed
        - /front_camera/camera/depth/image_rect_raw/compressedDepth
        - /front_camera/camera/aligned_depth_to_color/image_raw/compressedDepth
        - /back_camera/camera/color/image_raw/compressed
        - /back_camera/camera/infra1/image_rect_raw/compressed
        - /back_camera/camera/infra2/image_rect_raw/compressed
        - /back_camera/camera/depth/image_rect_raw/compressedDepth
        - /back_camera/camera/aligned_depth_to_color/image_raw/compressedDepth
        # --- Static TF / description (needed to replay GLIM and calibrate) ---
        - /tf_static
        - /robot_description
      include_unpublished_topics: false
      disable_keyboard_controls: true
      qos_profile_overrides_path: "/home/ros/utils/recording/qos_overrides.yaml"
    storage:
      storage_id: "mcap"
      storage_preset_profile: "fastwrite"
      max_cache_size: 1073741824   # 1 GiB write cache (default 100 MiB)
