# systemd-tmpfiles: raise the usbfs buffer limit (default 16 MB), as recommended
# by Intel for RealSense cameras using the libusb backend. usbcore is built into
# the kernel, so a udev/modprobe rule can't set it; tmpfiles applies it at boot.
w /sys/module/usbcore/parameters/usbfs_memory_mb - - - - 1000
